<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Marchio OrdiClick: la «O» di Ordi chiusa dal punto-click di Click.
       Tessera nel verde del tema (eo-color-starbucks-green), anello bianco,
       punto nel verde chiaro (eo-color-green-light) con un alone verde che
       lo stacca dall'anello anche a 16 px. Solo forme geometriche: nessun
       font da caricare. Le derivate raster (favicon.ico, icone PWA,
       apple-touch-icon) si rigenerano con `node scripts/build-icons.mjs`. -->
  <rect width="64" height="64" rx="14" fill="#006241"/>
  <path d="M 48.44 39.32 A 18 18 0 1 1 48.44 24.68" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="49" cy="32" r="9" fill="#006241"/>
  <circle cx="49" cy="32" r="6.5" fill="#d4e9e2"/>
</svg>
